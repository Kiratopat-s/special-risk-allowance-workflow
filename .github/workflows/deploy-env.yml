name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      compose_project:
        required: true
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    env:
      COMPOSE_PROJECT_NAME: ${{ inputs.compose_project }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Node runtime
        run: node --version

      - name: Set immutable image and deployment version
        env:
          RELEASE_LABEL: ${{ inputs.image_tag }}
        run: |
          version="${GITHUB_SHA:0:12}-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DEPLOYMENT_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$RELEASE_LABEL-$version" >> "$GITHUB_ENV"

      - name: Inject .env
        env:
          APP_PORT: ${{ vars.APP_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_ID: ${{ secrets.AUTH_KEYCLOAK_ID }}
          AUTH_KEYCLOAK_SECRET: ${{ secrets.AUTH_KEYCLOAK_SECRET }}
          AUTH_KEYCLOAK_ISSUER: ${{ vars.AUTH_KEYCLOAK_ISSUER }}
          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          NEXT_PUBLIC_APP_ENV: ${{ inputs.environment }}
        run: |
          {
            echo "APP_PORT=$APP_PORT"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "NEXTAUTH_URL=$NEXTAUTH_URL"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "AUTH_KEYCLOAK_ID=$AUTH_KEYCLOAK_ID"
            echo "AUTH_KEYCLOAK_SECRET=$AUTH_KEYCLOAK_SECRET"
            echo "AUTH_KEYCLOAK_ISSUER=$AUTH_KEYCLOAK_ISSUER"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USER=$EMAIL_USER"
            echo "EMAIL_PASS=$EMAIL_PASS"
            echo "EMAIL_FROM=$EMAIL_FROM"
            echo "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
            echo "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"
            echo "VAPID_SUBJECT=$VAPID_SUBJECT"
            echo "NEXT_PUBLIC_APP_ENV=$NEXT_PUBLIC_APP_ENV"
          } > .env

      - name: Build app image
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: docker build --target runner --build-arg GIT_COMMIT_SHA="$GIT_COMMIT_SHA" --build-arg DEPLOYMENT_VERSION="$DEPLOYMENT_VERSION" -t "sraw-app:$IMAGE_TAG" .

      - name: Build migrator image
        run: docker build --target migrator -t sraw-migrator:${IMAGE_TAG} .

      - name: Build email worker image
        run: docker build --target email-worker -t sraw-email-worker:${IMAGE_TAG} .

      - name: Validate email worker configuration without sending mail
        run: docker compose run --rm --no-deps email-worker bun scripts/email-worker.ts --check-config

      - name: Run database migrations
        run: docker compose --profile ops run --rm migrate

      - name: Verify database schema before replacing application
        run: docker compose --profile ops run --rm migrate bun run check:schema

      - name: Deploy application and email worker
        run: docker compose up -d app email-worker

      - name: Wait for application and email worker health checks
        run: |
          echo "Waiting for app and email worker to become healthy..."
          for i in $(seq 1 24); do
            healthy=true
            for service in app email-worker; do
              container_id=$(docker compose ps -q "$service")
              status="missing"
              if [ -n "$container_id" ]; then
                status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
              fi
              if [ "$status" != "healthy" ]; then
                healthy=false
              fi
            done
            if [ "$healthy" = true ]; then
              echo "App and email worker are healthy."
              exit 0
            fi
            echo "Attempt $i/24 - waiting 5s..."
            sleep 5
          done
          echo "Health checks failed after 120s"
          docker compose logs --tail=50 app email-worker
          exit 1

      - name: Verify deployed version
        env:
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          response=$(curl --fail --silent --show-error "http://127.0.0.1:${APP_PORT:-3000}/api/version")
          VERSION_RESPONSE="$response" node <<'NODE'
          const expected = process.env.DEPLOYMENT_VERSION;
          if (!expected) {
            console.error("Deployment verification failed: expected DEPLOYMENT_VERSION is missing.");
            process.exit(1);
          }

          let data;
          try {
            data = JSON.parse(process.env.VERSION_RESPONSE);
          } catch {
            console.error("Deployment verification failed: /api/version returned invalid JSON.");
            process.exit(1);
          }

          if (!data || typeof data.version !== "string" || !data.version.trim()) {
            console.error("Deployment verification failed: /api/version is missing a non-empty version string.");
            process.exit(1);
          }

          if (data.version !== expected) {
            console.error(`Deployment version mismatch: expected ${JSON.stringify(expected)}, actual ${JSON.stringify(data.version)}.`);
            process.exit(1);
          }

          console.log(`Deployment version verified: ${expected}`);
          NODE

      - name: Clean up .env
        if: always()
        run: rm -f .env

      - name: Clean up old images
        if: always()
        run: docker image prune -f
