name: Deploy

on:
  push:
    branches: [main]
    tags: ['prod-*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          export BUN_INSTALL="$HOME/.bun"
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  deploy-uat:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: self-hosted
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=uat-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Inject UAT .env
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          APP_PORT: ${{ vars.APP_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_ID: ${{ secrets.AUTH_KEYCLOAK_ID }}
          AUTH_KEYCLOAK_SECRET: ${{ secrets.AUTH_KEYCLOAK_SECRET }}
          AUTH_KEYCLOAK_ISSUER: ${{ vars.AUTH_KEYCLOAK_ISSUER }}
          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          {
            echo "APP_PORT=$APP_PORT"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "NEXTAUTH_URL=$NEXTAUTH_URL"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "AUTH_KEYCLOAK_ID=$AUTH_KEYCLOAK_ID"
            echo "AUTH_KEYCLOAK_SECRET=$AUTH_KEYCLOAK_SECRET"
            echo "AUTH_KEYCLOAK_ISSUER=$AUTH_KEYCLOAK_ISSUER"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USER=$EMAIL_USER"
            echo "EMAIL_PASS=$EMAIL_PASS"
            echo "EMAIL_FROM=$EMAIL_FROM"
            echo "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
            echo "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"
            echo "VAPID_SUBJECT=$VAPID_SUBJECT"
          } > .env

      - name: Build app image
        run: docker build --target runner -t sraw-app:${IMAGE_TAG} .

      - name: Build migrator image
        run: docker build --target migrator -t sraw-migrator:${IMAGE_TAG} .

      - name: Run database migrations
        run: docker compose --profile ops run --rm migrate

      - name: Deploy application
        run: docker compose up -d app

      - name: Wait for health check
        run: |
          echo "Waiting for app to become healthy..."
          for i in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:${APP_PORT:-3001}/api/health; then
              echo ""
              echo "App is healthy!"
              exit 0
            fi
            echo "Attempt $i/12 - waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 60s"
          docker compose logs app --tail=50
          exit 1

      - name: Clean up .env
        if: always()
        run: rm -f .env

      - name: Clean up old images
        if: always()
        run: docker image prune -f

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/prod-')
    needs: lint-and-test
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Inject production .env
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          APP_PORT: ${{ vars.APP_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_ID: ${{ secrets.AUTH_KEYCLOAK_ID }}
          AUTH_KEYCLOAK_SECRET: ${{ secrets.AUTH_KEYCLOAK_SECRET }}
          AUTH_KEYCLOAK_ISSUER: ${{ vars.AUTH_KEYCLOAK_ISSUER }}
          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          {
            echo "APP_PORT=$APP_PORT"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "NEXTAUTH_URL=$NEXTAUTH_URL"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "AUTH_KEYCLOAK_ID=$AUTH_KEYCLOAK_ID"
            echo "AUTH_KEYCLOAK_SECRET=$AUTH_KEYCLOAK_SECRET"
            echo "AUTH_KEYCLOAK_ISSUER=$AUTH_KEYCLOAK_ISSUER"
            echo "EMAIL_HOST=$EMAIL_HOST"
            echo "EMAIL_PORT=$EMAIL_PORT"
            echo "EMAIL_USER=$EMAIL_USER"
            echo "EMAIL_PASS=$EMAIL_PASS"
            echo "EMAIL_FROM=$EMAIL_FROM"
            echo "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
            echo "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"
            echo "VAPID_SUBJECT=$VAPID_SUBJECT"
          } > .env

      - name: Build app image
        run: docker build --target runner -t sraw-app:${IMAGE_TAG} .

      - name: Build migrator image
        run: docker build --target migrator -t sraw-migrator:${IMAGE_TAG} .

      - name: Run database migrations
        run: docker compose --profile ops run --rm migrate

      - name: Deploy application
        run: docker compose up -d app

      - name: Wait for health check
        run: |
          echo "Waiting for app to become healthy..."
          for i in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:${APP_PORT:-3000}/api/health; then
              echo ""
              echo "App is healthy!"
              exit 0
            fi
            echo "Attempt $i/12 - waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 60s"
          docker compose logs app --tail=50
          exit 1

      - name: Clean up .env
        if: always()
        run: rm -f .env

      - name: Clean up old images
        if: always()
        run: docker image prune -f
