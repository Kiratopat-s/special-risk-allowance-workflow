name: Deploy

on:
  push:
    branches: [main]
    tags: ['prod-*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vitest/jsdom run on Node; Bun remains the package manager.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Report test runtimes
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  deploy-uat:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-test
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: uat
      image_tag: "uat-$(echo ${{ github.sha }} | cut -c1-7)"
      compose_project: sraw-uat
    secrets: inherit

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/prod-')
    needs: lint-and-test
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      image_tag: "${{ github.ref_name }}"
      compose_project: sraw-prod
    secrets: inherit
